<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 | Page Not Found</title>
        <style>
            :root {
                --bg-color: #0a0a0a;
                --text-color: #fff;
                --accent-color: #3b82f6; /* Blue accent */
            }
            body {
                margin: 0;
                padding: 0;
                background-color: var(--bg-color);
                color: var(--text-color);
                font-family: "Courier New", Courier, monospace;
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                overflow: hidden;
            }
            .container {
                text-align: center;
            }
            .error-code {
                font-size: 8rem;
                font-weight: bold;
                margin: 0;
                letter-spacing: -5px;
                position: relative;
                display: inline-block;
            }
            .error-code::before {
                content: "404";
                position: absolute;
                left: 2px;
                text-shadow: -2px 0 #ff00c1;
                clip: rect(44px, 450px, 56px, 0);
                animation: glitch 5s infinite linear alternate-reverse;
            }
            .message {
                font-size: 1.2rem;
                margin-top: 1rem;
                opacity: 0.8;
            }
            .home-link {
                display: inline-block;
                margin-top: 2rem;
                padding: 10px 20px;
                border: 1px solid var(--accent-color);
                color: var(--accent-color);
                text-decoration: none;
                transition: all 0.3s ease;
            }
            .home-link:hover {
                background-color: var(--accent-color);
                color: #fff;
                box-shadow: 0 0 20px var(--accent-color);
            }
            @keyframes glitch {
                0% {
                    clip: rect(31px, 9999px, 94px, 0);
                }
                20% {
                    clip: rect(62px, 9999px, 42px, 0);
                }
                40% {
                    clip: rect(16px, 9999px, 78px, 0);
                }
                60% {
                    clip: rect(81px, 9999px, 13px, 0);
                }
                80% {
                    clip: rect(54px, 9999px, 86px, 0);
                }
                100% {
                    clip: rect(23px, 9999px, 33px, 0);
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1 class="error-code">404</h1>
            <p class="message">> Destination unreachable.</p>
            <p class="message">> Path: <span id="path"></span></p>
            <a href="/" class="home-link">Return to Home</a>
        </div>

        <script>
            // Display the broken path for a personal touch
            document.getElementById("path").textContent = window.location.pathname;
        </script>
    </body>
</html>
