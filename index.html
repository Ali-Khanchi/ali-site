<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>About | Ali Khanchi</title>
        <!-- SEO description (Google snippet) -->
        <meta name="description" content="Personal CV" />

        <!-- Mobile: PWA-style name on home screen -->
        <meta name="application-name" content="About | Ali Khanchi" />
        <meta name="apple-mobile-web-app-title" content="About | Ali Khanchi" />

        <!-- Theme color (browser chrome on mobile) -->
        <meta name="theme-color" content="#ffffff" />

        <!-- Open Graph (WhatsApp, Slack, social previews) -->
        <meta property="og:title" content="About | Ali Khanchi" />
        <meta property="og:description" content="Personal CV" />
        <!-- <meta
            property="og:image"
            content=""
        /> -->
        <script>
            (function(l) {
                if (l.search[1] === '/' ) {
                var decoded = l.search.slice(1).split('&').map(function(s) { 
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.subfolder + decoded + l.hash
                );
                }
            }(window.location));
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
